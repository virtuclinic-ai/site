<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Olivia - UNITH Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      color: #001f3f;
    }

    .header p {
      margin: 0;
      color: #4b5563;
      line-height: 1.5;
    }

    .embed-box {
      width: 100%;
      height: 700px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      overflow: hidden;
    }

    unith-widget {
      display: block;
      width: 100%;
      height: 100%;
    }

    .note {
      margin-top: 14px;
      font-size: 14px;
      color: #6b7280;
    }

    .debug {
      margin-top: 18px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 13px;
      color: #374151;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>

  <script src="https://embedded-stream.unith.ai/index.js" defer></script>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>Olivia – UNITH Digital Health Advisor</h1>
      <p>
        This is the standalone UNITH test page for Olivia. Please test this page directly in Google Chrome.
      </p>
    </div>

    <div class="embed-box">
      <unith-widget
        head-id="olivia-26963"
        org-id="Virtuclinic-1663"
        api-key="a015eb9181bf4270b9b6bb3bfccad71f"
        language="en-US"
        username="guest-user"
        variant="fullscreen">
      </unith-widget>
    </div>

    <div class="note">
      If this page stays blank in Chrome, the next thing to check is the browser console for script-loading or credential errors.
    </div>

    <div class="debug" id="debugBox">Checking UNITH widget script...</div>
  </div>

  <script>
    const debugBox = document.getElementById("debugBox");

    function setDebug(msg) {
      debugBox.textContent = msg;
    }

    window.addEventListener("load", () => {
      setTimeout(() => {
        const widget = document.querySelector("unith-widget");
        const widgetDefined = !!customElements.get("unith-widget");

        setDebug(
          "Page loaded.\n" +
          "customElements.get('unith-widget'): " + (widgetDefined ? "defined" : "NOT defined") + "\n" +
          "Widget element found: " + (!!widget) + "\n" +
          "Browser userAgent: " + navigator.userAgent + "\n\n" +
          "If 'NOT defined' appears, the UNITH script likely did not load.\n" +
          "If it is defined but the box is still blank, test in Chrome and inspect console errors."
        );
      }, 2000);
    });
  </script>
</body>
</html>
