<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Olivia - Digital Health Advisor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff;
      overflow-x: hidden;
      font-family: Inter, system-ui, Arial, sans-serif;
    }

    unith-widget {
      display: contents;
    }

    .dha-coach-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2147483000}
    .dha-hidden{display:none!important}
    .dha-coach-card{width:min(560px,92vw);background:#fff;border-radius:14px;padding:20px;box-shadow:0 20px 80px rgba(0,0,0,.35);font-family:Inter,system-ui,Arial,sans-serif}
    .dha-coach-card h2{margin:0 0 8px;font-size:20px;color:#0b1d3a}
    .dha-coach-card p{margin:0 0 14px;color:#374151;line-height:1.45}
    .dha-row{display:flex;gap:10px;flex-wrap:wrap}
    .dha-btn{appearance:none;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
    .dha-btn.primary{background:#0b57d0;color:#fff}
    .dha-btn.ghost{background:#fff;border:1px solid #d1d5db;color:#374151}

    .dha-pulse{position:fixed;right:16px;bottom:16px;width:96px;height:96px;border-radius:999px;pointer-events:none;z-index:2147483001}
    .dha-pulse::before,.dha-pulse::after{content:"";position:absolute;inset:0;border-radius:999px;border:3px solid rgba(11,87,208,.55);animation:dha-pulse 1.8s ease-out infinite}
    .dha-pulse::after{animation-delay:.9s}
    @keyframes dha-pulse{0%{transform:scale(.6);opacity:.9}70%{opacity:.15}100%{transform:scale(1.25);opacity:0}}

    .dha-arrow{position:fixed;right:128px;bottom:92px;z-index:2147483001}
    .dha-arrow svg{width:72px;height:72px;fill:none;stroke:#0b57d0;stroke-width:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
  </style>

  <script src="https://embedded-stream.unith.ai/index.js" defer></script>
</head>
<body>

  <div id="dhaCoach" class="dha-coach-backdrop" role="dialog" aria-modal="true" aria-labelledby="dhaCoachTitle">
    <div class="dha-coach-card" role="document">
      <h2 id="dhaCoachTitle">Ready when you are</h2>
      <p>
        Click the assistant in the <strong>bottom-right corner</strong> to start. You can talk or type, and I’ll paste names, addresses, and phone numbers into the chat so you can copy them easily. Please make sure to enable your camera and microphone.
      </p>
      <div class="dha-row">
        <button id="dhaStartNow" class="dha-btn primary" type="button">Start now</button>
        <button id="dhaLater" class="dha-btn ghost" type="button">Maybe later</button>
      </div>
    </div>
  </div>

  <div id="dhaPulse" class="dha-pulse" aria-hidden="true"></div>
  <div id="dhaArrow" class="dha-arrow" aria-hidden="true">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M6 10 C28 18, 36 30, 42 44 M42 44 L34 42 M42 44 L40 36"/>
    </svg>
  </div>

  <unith-widget
    head_id="olivia-26963"
    org_id="Virtuclinic-1663"
    api_key="a015eb9181bf4270b9b6bb3bfccad71f"
    language="en-US"
    username="guest-user"
    variant="widget"
    placement="bottom right">
  </unith-widget>

  <script>
    (function(){
      const coach = document.getElementById('dhaCoach');
      const startBtn = document.getElementById('dhaStartNow');
      const laterBtn = document.getElementById('dhaLater');
      const pulse = document.getElementById('dhaPulse');
      const arrow = document.getElementById('dhaArrow');
      const HOST_DHA_PAGE = 'https://virtuclinic-ai.github.io/site/archive.html';

      function hideHints() {
        coach.classList.add('dha-hidden');
        pulse.classList.add('dha-hidden');
        arrow.classList.add('dha-hidden');
      }

      startBtn.addEventListener('click', () => {
        hideHints();
        const widget = document.querySelector('unith-widget');
        if (widget) widget.click();
      });

      laterBtn.addEventListener('click', () => {
        hideHints();
        window.location.href = HOST_DHA_PAGE;
      });
    })();
  </script>

</body>
</html>
